<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>California House Price Map</title>
  <meta name="description" content="Click anywhere in California to estimate the 1990 median house value with a random forest model, and see what drives the price.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 2 15h4v14h8v-9h4v9h8V15h4z' fill='%232a78d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <main class="map-wrap">
      <div id="map" aria-label="Map of California. Click a location to estimate its median house value."></div>
      <header class="map-title card">
        <h1>California House Price Map</h1>
        <p>Click anywhere in California to estimate the median house value.</p>
      </header>
      <div class="legend card" id="legend" hidden>
        <p class="legend-title">Median house value (1990)</p>
        <div class="legend-bar" id="legend-bar"></div>
        <div class="legend-ticks" id="legend-ticks"></div>
        <p class="legend-note">Each dot is a census block.</p>
      </div>
    </main>

    <aside class="panel" id="panel" aria-label="Prediction details">
      <div class="progress" aria-hidden="true"></div>
      <div class="panel-body" id="panel-body"></div>
      <p class="sr-only" id="announcer" aria-live="polite"></p>
    </aside>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="app.js"></script>
</body>
</html>
